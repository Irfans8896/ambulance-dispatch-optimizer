<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Ambulance Dispatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body { background: #f4f6f8; }</style>
</head>
<body>
<div class="container" style="max-width: 420px;">
  <div class="text-center mt-5 mb-3"><div style="font-size:3rem">&#128657;</div>
    <h4>Ambulance Dispatch Route Optimizer</h4><div class="text-muted small">Please sign in</div></div>
  <div class="card shadow-sm"><div class="card-body">
    {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="mb-3"><label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-danger w-100" type="submit">Sign in</button>
    </form>
  </div></div>
  {% if show_demo %}
  <div class="card mt-3"><div class="card-body small">
    <b>Demo accounts</b>
    <table class="table table-sm mb-0 mt-1">
      <tr><td>admin</td><td>admin123</td><td class="text-muted">everything</td></tr>
      <tr><td>dispatcher</td><td>dispatch123</td><td class="text-muted">dispatch, status</td></tr>
      <tr><td>driver1</td><td>driver123</td><td class="text-muted">own ambulance only</td></tr>
    </table>
  </div></div>
  {% endif %}
</div>
</body>
</html>
