<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | Ambulance Dispatch Route Optimizer</title>
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Bootstrap 5 & Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  body {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-card {
    background: #ffffff;
    color: #1e293b;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    padding: 2rem;
    width: 100%;
    max-width: 440px;
  }
  .btn-sign-in {
    background: linear-gradient(135deg, #e63946 0%, #dc2626 100%);
    color: #ffffff;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 0.75rem;
    transition: all 0.2s ease;
  }
  .btn-sign-in:hover {
    background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(230, 57, 70, 0.35);
    color: #ffffff;
  }
  .demo-account-pill {
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .demo-account-pill:hover {
    background: #e2e8f0;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="text-center mb-4">
    <div class="bg-danger text-white rounded-circle p-3 d-inline-flex align-items-center justify-content-center shadow mb-2" style="width: 56px; height: 56px;">
      <i class="bi bi-truck-flatbed fs-3"></i>
    </div>
    <h4 class="fw-bold mb-0 text-dark">Emergency Command Center</h4>
    <div class="text-muted small">Ambulance Dispatch & Route Optimizer</div>
  </div>

  {% if error %}
    <div class="alert alert-danger py-2 small rounded-3 d-flex align-items-center gap-2">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <div>{{ error }}</div>
    </div>
  {% endif %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label small fw-semibold text-muted" for="username">Operator Username</label>
      <div class="input-group">
        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
        <input class="form-control" id="username" name="username" placeholder="admin" autocomplete="username" required autofocus>
      </div>
    </div>
    
    <div class="mb-4">
      <label class="form-label small fw-semibold text-muted" for="password">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
        <input class="form-control" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
    </div>

    <button class="btn btn-sign-in w-100 d-flex align-items-center justify-content-center gap-2" type="submit">
      <i class="bi bi-box-arrow-in-right"></i>
      <span>Sign In to Terminal</span>
    </button>
  </form>

  {% if show_demo %}
  <div class="mt-4 pt-3 border-top">
    <div class="small fw-bold text-muted mb-2"><i class="bi bi-key me-1"></i> Quick Demo Logins (Click to autofill):</div>
    <div class="d-flex flex-column gap-1">
      <div class="p-2 rounded bg-light border demo-account-pill d-flex justify-content-between align-items-center" onclick="fill('admin', 'admin123')">
        <div>
          <span class="fw-bold text-danger">admin</span> <span class="text-muted small">/ admin123</span>
        </div>
        <span class="badge bg-danger">Full Control</span>
      </div>
      <div class="p-2 rounded bg-light border demo-account-pill d-flex justify-content-between align-items-center" onclick="fill('dispatcher', 'dispatch123')">
        <div>
          <span class="fw-bold text-primary">dispatcher</span> <span class="text-muted small">/ dispatch123</span>
        </div>
        <span class="badge bg-primary">Dispatch Ops</span>
      </div>
      <div class="p-2 rounded bg-light border demo-account-pill d-flex justify-content-between align-items-center" onclick="fill('driver1', 'driver123')">
        <div>
          <span class="fw-bold text-success">driver1</span> <span class="text-muted small">/ driver123</span>
        </div>
        <span class="badge bg-success">Driver Unit</span>
      </div>
    </div>
  </div>
  {% endif %}
</div>

<script>
function fill(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}
</script>
</body>
</html>
