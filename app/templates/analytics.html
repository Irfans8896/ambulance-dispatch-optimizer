<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics - Ambulance Dispatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body { background: #f4f6f8; } .stat { font-size: 1.8rem; font-weight: 600; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-danger mb-3">
  <div class="container-fluid"><span class="navbar-brand mb-0 h1">Analytics</span>
    <span class="small"><a class="text-white me-2" href="/">Dashboard</a><a class="text-white" href="/logout">Logout</a></span></div>
</nav>
<div class="container-fluid">
  <div class="row g-3 mb-3" id="cards"></div>
  <div id="empty" class="alert alert-info d-none">
    No dispatches yet. Dispatch some emergencies on the dashboard
    <span class="d-none" data-roles="admin">or <button class="btn btn-sm btn-outline-dark" id="demoBtn">generate 10 demo emergencies</button></span>.
  </div>
  <div class="row g-3 mb-4">
    <div class="col-md-6 col-xl-4"><div class="card"><div class="card-body"><h6>Emergencies by type</h6><canvas id="cType" height="220"></canvas></div></div></div>
    <div class="col-md-6 col-xl-4"><div class="card"><div class="card-body"><h6>Emergencies by severity</h6><canvas id="cSev" height="220"></canvas></div></div></div>
    <div class="col-md-6 col-xl-4"><div class="card"><div class="card-body"><h6>Trips per ambulance</h6><canvas id="cAmb" height="220"></canvas></div></div></div>
    <div class="col-md-6"><div class="card"><div class="card-body"><h6>Response time of the latest dispatches (minutes)</h6><canvas id="cEta" height="200"></canvas></div></div></div>
    <div class="col-md-6"><div class="card"><div class="card-body"><h6>Emergencies by hour of day</h6><canvas id="cHour" height="200"></canvas></div></div></div>
    <div class="col-12"><div class="card"><div class="card-body"><h6>Patients per hospital</h6><div id="hosp" class="small"></div></div></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const _fetch = window.fetch;
window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401) location = '/login'; return r; };
const charts = {};
function draw(id, config) { if (charts[id]) charts[id].destroy(); charts[id] = new Chart($(id), config); }
const COLORS = ['#dc3545', '#0d6efd', '#198754', '#fd7e14', '#6f42c1', '#20c997'];

async function load() {
  const r = await fetch('/api/analytics');
  if (!r.ok) { document.body.insertAdjacentHTML('beforeend', '<div class="container"><div class="alert alert-warning">You are not allowed to see analytics.</div></div>'); return; }
  const a = await r.json(), t = a.totals;
  const num = v => v == null ? '-' : v;
  $('cards').innerHTML = [
    ['Dispatches', t.dispatches], ['Completed', t.completed], ['Waiting in queue', t.queued], ['Reroutes', t.reroutes],
    ['Average response', num(t.avg_eta_min) + (t.avg_eta_min == null ? '' : ' min')],
    ['Within ' + t.target_min + ' min', t.within_target_pct == null ? '-' : t.within_target_pct + '%']
  ].map(c => `<div class="col-6 col-md-4 col-xl-2"><div class="card"><div class="card-body py-2"><div class="stat">${c[1]}</div>
     <div class="small text-muted">${c[0]}</div></div></div></div>`).join('');
  $('empty').classList.toggle('d-none', t.dispatches > 0);

  const keys = o => Object.keys(o), vals = o => Object.values(o);
  draw('cType', {type: 'doughnut', data: {labels: keys(a.by_type), datasets: [{data: vals(a.by_type), backgroundColor: COLORS}]}});
  draw('cSev', {type: 'bar', data: {labels: keys(a.by_severity), datasets: [{label: 'Emergencies', data: vals(a.by_severity), backgroundColor: '#dc3545'}]},
    options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, ticks: {precision: 0}}}}});
  draw('cAmb', {type: 'bar', data: {labels: a.per_ambulance.map(x => x.vehicle_number), datasets: [{label: 'Trips', data: a.per_ambulance.map(x => x.trips), backgroundColor: '#0d6efd'}]},
    options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, ticks: {precision: 0}}}}});
  draw('cEta', {type: 'line', data: {labels: a.eta_series.map(x => '#' + x.dispatch_id), datasets: [
      {label: 'Response time', data: a.eta_series.map(x => x.eta_min), borderColor: '#198754', tension: 0.2},
      {label: 'Target', data: a.eta_series.map(() => t.target_min), borderColor: '#dc3545', borderDash: [6, 6], pointRadius: 0}]},
    options: {scales: {y: {beginAtZero: true}}}});
  draw('cHour', {type: 'bar', data: {labels: a.by_hour.map((_, h) => h), datasets: [{label: 'Emergencies', data: a.by_hour, backgroundColor: '#fd7e14'}]},
    options: {plugins: {legend: {display: false}}, scales: {y: {beginAtZero: true, ticks: {precision: 0}}}}});
  $('hosp').innerHTML = keys(a.by_hospital).map(h => `<span class="badge text-bg-secondary me-2">${esc(h)}: ${a.by_hospital[h]}</span>`).join('') || '<span class="text-muted">None yet</span>';
}

fetch('/api/me').then(r => r.json()).then(me =>
  document.querySelectorAll('[data-roles]').forEach(el => el.classList.toggle('d-none', !el.dataset.roles.split(',').includes(me.role))));
$('demoBtn').onclick = async () => {
  $('demoBtn').disabled = true;
  await fetch('/api/demo/simulate', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({count: 10})});
  $('demoBtn').disabled = false; load();
};
load(); setInterval(load, 10000);
</script>
</body>
</html>
